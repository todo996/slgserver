name: Kiểm tra backend hợp nhất

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Đồng bộ thư viện
        run: go mod tidy

      - name: Chạy unit test
        run: go list ./... | grep -v '/main$' | xargs go test

      - name: Build bộ khởi chạy hợp nhất
        run: go build -o /tmp/allserver ./main/allserver.go

      - name: Build đủ năm thành phần
        run: |
          go build -o /tmp/gateserver ./main/gateserver.go
          go build -o /tmp/httpserver ./main/httpserver.go
          go build -o /tmp/loginserver ./main/loginserver.go
          go build -o /tmp/chatserver ./main/chatserver.go
          go build -o /tmp/slgserver ./main/slgserver.go

      - name: Build công cụ kiểm thử đăng nhập
        run: go build -o /tmp/authsmoke ./tools/authsmoke

      - name: Build Docker image Railway
        run: docker build -f Dockerfile.railway -t tam-quoc-server:test .

  one-service-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slg
          POSTGRES_PASSWORD: slg
          POSTGRES_DB: slgdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slg -d slgdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://slg:slg@127.0.0.1:5432/slgdb?sslmode=disable
      PGPASSWORD: slg
      TEST_ACCOUNT_USERNAME: auth-smoke@example.com
      TEST_ACCOUNT_PASSWORD: MatKhau-AnToan-2026
      TEST_PREVIEW_ORIGIN: https://auth-preview-yrhbmcgnrg-8940s-projects.vercel.app
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Cài PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Chạy migration Supabase
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Đang chạy $migration"
            psql -h 127.0.0.1 -U slg -d slgdb -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Xác nhận schema game
        run: |
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'tb_%';")" -ge 16
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT data_type FROM information_schema.columns WHERE table_name='tb_general_1' AND column_name='skills';")" = "jsonb"
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT data_type FROM information_schema.columns WHERE table_name='tb_user_info' AND column_name='passwd';")" = "character varying"

      - name: Build Docker image hợp nhất
        run: docker build -f Dockerfile.railway -t tam-quoc-server:one-service .

      - name: Chạy một container duy nhất
        run: |
          docker run --detach --network host \
            --name tam-quoc-one-service \
            --env PORT=18080 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env CORS_ALLOWED_ORIGINS=http://localhost:4173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:4173 \
            --env GATE_PUBLIC_URL=ws://127.0.0.1:18080 \
            --env XORM_SHOW_SQL=false \
            --env STARTUP_TIMEOUT=180s \
            tam-quoc-server:one-service

      - name: Kiểm tra health tổng và năm thành phần
        run: |
          set -euo pipefail
          ready_ok=false
          for attempt in $(seq 1 180); do
            ready=$(curl --silent http://127.0.0.1:18080/readyz || true)
            if echo "$ready" | grep -q '"status":"ok"'; then
              ready_ok=true
              echo "$ready"
              break
            fi
            sleep 1
          done
          if [ "$ready_ok" != "true" ]; then
            docker logs tam-quoc-one-service || true
            exit 1
          fi

          health=$(curl --fail --silent http://127.0.0.1:18080/healthz)
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"service":"allserver"'

          ready=$(curl --fail --silent http://127.0.0.1:18080/readyz)
          echo "$ready" | grep -q '"service":"allserver"'
          for child in login chat slg gate http; do
            echo "$ready" | grep -q "\"$child\":\"ok\""
          done

      - name: Kiểm tra đăng ký HTTP và CORS Preview Vercel
        run: |
          set -euo pipefail

          get_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:18080/account/register?username=${TEST_ACCOUNT_USERNAME}&password=${TEST_ACCOUNT_PASSWORD}")
          test "$get_status" = "405"

          preflight_headers=$(mktemp)
          preflight_status=$(curl --silent --output /dev/null --dump-header "$preflight_headers" --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: ${TEST_PREVIEW_ORIGIN}" \
            --header 'Access-Control-Request-Method: POST' \
            http://127.0.0.1:18080/account/register)
          test "$preflight_status" = "204"
          grep -qi "access-control-allow-origin: ${TEST_PREVIEW_ORIGIN}" "$preflight_headers"

          register_headers=$(mktemp)
          register_response=$(curl --fail --silent --request POST \
            --dump-header "$register_headers" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --header "Origin: ${TEST_PREVIEW_ORIGIN}" \
            --data-urlencode "username=${TEST_ACCOUNT_USERNAME}" \
            --data-urlencode "password=${TEST_ACCOUNT_PASSWORD}" \
            --data-urlencode 'hardware=github-actions' \
            http://127.0.0.1:18080/account/register)
          echo "$register_response" | grep -q '"code":0'
          grep -qi "access-control-allow-origin: ${TEST_PREVIEW_ORIGIN}" "$register_headers"

          stored_hash=$(psql -h 127.0.0.1 -U slg -d slgdb -Atc \
            "SELECT passwd FROM public.tb_user_info WHERE username='${TEST_ACCOUNT_USERNAME}';")
          case "$stored_hash" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "Mật khẩu không phải bcrypt"; exit 1 ;;
          esac
          test "${#stored_hash}" = "60"
          test "$stored_hash" != "$TEST_ACCOUNT_PASSWORD"

          duplicate_response=$(curl --fail --silent --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --header "Origin: ${TEST_PREVIEW_ORIGIN}" \
            --data-urlencode "username=${TEST_ACCOUNT_USERNAME}" \
            --data-urlencode "password=${TEST_ACCOUNT_PASSWORD}" \
            http://127.0.0.1:18080/account/register)
          echo "$duplicate_response" | grep -q '"code":3'

      - name: Kiểm tra đăng nhập WebSocket thật qua cổng public
        run: |
          set -euo pipefail
          AUTH_SMOKE_WS_URL=ws://127.0.0.1:18080 \
          AUTH_SMOKE_ORIGIN="$TEST_PREVIEW_ORIGIN" \
          AUTH_SMOKE_USERNAME="$TEST_ACCOUNT_USERNAME" \
          AUTH_SMOKE_PASSWORD="$TEST_ACCOUNT_PASSWORD" \
            go run ./tools/authsmoke

      - name: Dừng container và kiểm tra log cuối
        if: always()
        run: |
          docker logs tam-quoc-one-service || true
          docker rm --force tam-quoc-one-service >/dev/null 2>&1 || true
