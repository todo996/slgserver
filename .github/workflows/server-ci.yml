name: Kiểm tra backend

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Đồng bộ thư viện
        run: go mod tidy

      - name: Chạy unit test
        run: go list ./... | grep -v '/main$' | xargs go test

      - name: Build Gate Server
        run: go build -o /tmp/gateserver ./main/gateserver.go

      - name: Build HTTP Server
        run: go build -o /tmp/httpserver ./main/httpserver.go

      - name: Build Login Server
        run: go build -o /tmp/loginserver ./main/loginserver.go

      - name: Build Chat Server
        run: go build -o /tmp/chatserver ./main/chatserver.go

      - name: Build SLG Server
        run: go build -o /tmp/slgserver ./main/slgserver.go

      - name: Build Docker image Railway
        run: docker build -f Dockerfile.railway -t tam-quoc-server:test .

  postgres-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slg
          POSTGRES_PASSWORD: slg
          POSTGRES_DB: slgdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slg -d slgdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://slg:slg@127.0.0.1:5432/slgdb?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      WS_ALLOWED_ORIGINS: http://localhost:4173
      XORM_SHOW_SQL: 'false'
      PGPASSWORD: slg
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Đồng bộ thư viện Go
        run: go mod tidy

      - name: Cài PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Chạy migration Supabase
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Đang chạy $migration"
            psql -h 127.0.0.1 -U slg -d slgdb -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Xác nhận schema game
        run: |
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'tb_%';")" -ge 16
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT data_type FROM information_schema.columns WHERE table_name='tb_general_1' AND column_name='skills';")" = "jsonb"
          test "$(psql -h 127.0.0.1 -U slg -d slgdb -Atc "SELECT data_type FROM information_schema.columns WHERE table_name='tb_user_info' AND column_name='passwd';")" = "character varying"

      - name: Build đủ năm service
        run: |
          go build -o /tmp/httpserver ./main/httpserver.go
          go build -o /tmp/loginserver ./main/loginserver.go
          go build -o /tmp/chatserver ./main/chatserver.go
          go build -o /tmp/slgserver ./main/slgserver.go
          go build -o /tmp/gateserver ./main/gateserver.go

      - name: Kiểm tra HTTP, đăng ký POST và bcrypt
        run: |
          set -euo pipefail
          PORT=8088 /tmp/httpserver >/tmp/httpserver.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== HTTP SERVER LOG ====="
              cat /tmp/httpserver.log || true
              echo "==========================="
            fi
            kill "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8088/healthz | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 1
          done
          echo "healthz=$healthy"
          test "$healthy" = "true"

          get_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:8088/account/register?username=testuser&password=0123456789abcdef0123456789abcdef')
          echo "GET /account/register status=$get_status"
          test "$get_status" = "405"

          register_response=$(curl --silent --show-error --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=testuser' \
            --data-urlencode 'password=0123456789abcdef0123456789abcdef' \
            --data-urlencode 'hardware=github-actions' \
            http://127.0.0.1:8088/account/register)
          echo "register_response=$register_response"
          echo "$register_response" | grep -q '"code":0'

          stored_hash=$(psql -h 127.0.0.1 -U slg -d slgdb -Atc \
            "SELECT passwd FROM public.tb_user_info WHERE username='testuser';")
          echo "stored_hash_length=${#stored_hash}"
          echo "stored_hash_prefix=$(printf '%s' "$stored_hash" | cut -c1-4)"
          case "$stored_hash" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "Mật khẩu không phải bcrypt"; exit 1 ;;
          esac

          passcode=$(psql -h 127.0.0.1 -U slg -d slgdb -Atc \
            "SELECT COALESCE(passcode, '') FROM public.tb_user_info WHERE username='testuser';")
          echo "passcode_length=${#passcode}"
          test -z "$passcode"

          duplicate_response=$(curl --silent --show-error --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=testuser' \
            --data-urlencode 'password=0123456789abcdef0123456789abcdef' \
            http://127.0.0.1:8088/account/register)
          echo "duplicate_response=$duplicate_response"
          echo "$duplicate_response" | grep -q '"code":3'

      - name: Khởi động và kiểm tra bốn WebSocket service
        run: |
          set -euo pipefail

          PORT=8003 /tmp/loginserver >/tmp/loginserver.log 2>&1 &
          login_pid=$!
          PORT=8002 /tmp/chatserver >/tmp/chatserver.log 2>&1 &
          chat_pid=$!
          PORT=8001 /tmp/slgserver >/tmp/slgserver.log 2>&1 &
          slg_pid=$!
          PORT=8004 \
          LOGIN_PROXY_URL=ws://127.0.0.1:8003 \
          CHAT_PROXY_URL=ws://127.0.0.1:8002 \
          SLG_PROXY_URL=ws://127.0.0.1:8001 \
          /tmp/gateserver >/tmp/gateserver.log 2>&1 &
          gate_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              for service in login chat slg gate; do
                echo "===== ${service^^} SERVER LOG ====="
                cat "/tmp/${service}server.log" || true
              done
            fi
            kill "$login_pid" "$chat_pid" "$slg_pid" "$gate_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          wait_health() {
            name=$1
            port=$2
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:${port}/healthz" | grep -q '"status":"ok"'; then
                echo "$name healthcheck thành công"
                return 0
              fi
              sleep 1
            done
            echo "$name không sẵn sàng trên cổng $port"
            return 1
          }

          wait_health login-service 8003
          wait_health chat-service 8002
          wait_health slg-service 8001
          wait_health gate-service 8004
